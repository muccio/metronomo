name: Metronomo

options:
  bundleIdPrefix: com.metronomo
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  Metronomo:
    type: application
    platform: macOS
    sources:
      - path: Metronomo
        excludes:
          - Info.plist
    info:
      path: Metronomo/Info.plist
      properties:
        CFBundleName: Metronomo
        CFBundleDisplayName: Metronomo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.music
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Metronomo"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metronomo.app
        PRODUCT_NAME: Metronomo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets: []
